# Refreshes data.json / data.js in the cloud so the GitHub Pages site stays
# current without the local machine being awake. Mirrors the local cron.
name: Refresh data

on:
  schedule:
    # off-peak minutes — GitHub delays/drops crons scheduled on :00/:30.
    #
    # This used to ask for ~240 runs a week (every 10 min, 13-20 UTC) and GitHub
    # delivered 2-3 a DAY: it sheds scheduled runs from dense schedules, so the
    # extra entries were actively costing us delivery. Live prices and mNAV now
    # refresh client-side from strategy.com, so the cron's real job is the data
    # only it can reach — SEC filings, short interest, borrow fees, settled
    # closes. That job needs reliability, not frequency.
    #
    # MSTR and ASST both file their weekly 8-Ks on Monday morning ET, so Monday
    # gets deliberate redundancy across the filing window rather than one shot.
    - cron: "12 11 * * 1"           # Mon 7:12 am ET — filing window
    - cron: "22 12 * * 1"           # Mon 8:22 am ET
    - cron: "32 13 * * 1"           # Mon 9:32 am ET
    - cron: "42 15 * * 1"           # Mon 11:42 am ET — backstop if the above are dropped
    - cron: "40 10 * * 2-5"         # ~6:40 am ET pre-market, Tue-Fri
    - cron: "23 14,17 * * 1-5"      # twice during US market hours
    # Daily close capture. Requested after 4:00pm ET, but the closing auction needs
    # a few minutes to settle (a 16:03 run caught MSTR at 118.94 vs the official
    # 119.25), so these fire at ~4:09pm ET. GitHub is UTC-only and delays crons off
    # :00/:30, hence two entries — 20:09 UTC is EDT, 21:09 UTC is EST.
    - cron: "9 20 * * 1-5"          # 4:09pm EDT (summer)
    - cron: "9 21 * * 1-5"          # 4:09pm EST (winter)
    - cron: "7 22 * * 5"            # Fri ~5-6pm ET — safety net if the close run drops
    - cron: "17 14 * * 6"           # Sat — catch anything filed late Friday
  workflow_dispatch:               # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install certifi

      - name: Run refresh
        run: python refresh_data.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
